name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux · fmt / clippy / test / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchains are pinned by files: `rust-toolchain.toml` (workspace:
      # stable) and `fuzz/rust-toolchain.toml` (nightly), so plain `cargo`
      # always resolves stable regardless of install order. Nightly is
      # installed explicitly because only `cargo +nightly fmt` needs it (the
      # rustfmt.toml uses unstable options).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (nightly rustfmt options)
        run: cargo +nightly fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Deny (licenses / advisories / bans)
        uses: EmbarkStudios/cargo-deny-action@v2

  windows:
    name: Windows · clippy / test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features — Windows adapters)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Tests (all features — pipes, chaos, sched-task)
        run: cargo test --workspace --all-features

      - name: Build
        run: cargo build --workspace

      # The injectee sensor DLL is a separate nightly workspace (retour
      # static detours need nightly); excluded from the main workspace, so
      # build it explicitly — it must not rot in a corner.
      - uses: dtolnay/rust-toolchain@nightly

      - name: Build injectee (separate nightly workspace)
        run: cargo build --locked --manifest-path crates/injectee/Cargo.toml

  driver:
    name: Windows · driver build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # WDK 10.0.26100 matches the dev box. The WDK installer deploys the
      # `WindowsKernelModeDriver10.0` MSBuild toolset into the preinstalled
      # VS2022 (verified locally: VS-integrated under VC/v170 PlatformToolsets).
      - name: Install Windows SDK + WDK (winget)
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsSDK.10.0.26100 --exact --silent --accept-package-agreements --accept-source-agreements
          winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --silent --accept-package-agreements --accept-source-agreements

      - name: Build driver + dumper
        shell: pwsh
        run: ./driver/build.ps1 -Configuration Release
