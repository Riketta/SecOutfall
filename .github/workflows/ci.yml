name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux · fmt / clippy / test / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchains are pinned by files: `rust-toolchain.toml` (workspace:
      # stable) and `fuzz/rust-toolchain.toml` (nightly), so plain `cargo`
      # always resolves stable regardless of install order. Nightly is
      # installed explicitly because only `cargo +nightly fmt` needs it (the
      # rustfmt.toml uses unstable options).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (nightly rustfmt options)
        run: cargo +nightly fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The fuzz targets are Linux+nightly only (libFuzzer); these short
      # batches are the CI-visible twin of the host proptests in
      # `crates/protocol/tests/prop_wire.rs` — same call sites, hostile input.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz (short batches)
        working-directory: fuzz
        timeout-minutes: 15
        run: |
          for target in parse_frame parse_config decode_screenshot_payload decode_driver_wire; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done

      - name: Deny (licenses / advisories / bans)
        uses: EmbarkStudios/cargo-deny-action@v2

  windows:
    name: Windows · clippy / test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features — Windows adapters)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Tests (all features — pipes, chaos, sched-task)
        run: cargo test --workspace --all-features

      - name: Build
        run: cargo build --workspace

      - name: Build (all features)
        run: cargo build --workspace --all-features

      # The injectee sensor DLL is a separate nightly workspace (retour
      # static detours need nightly); excluded from the main workspace, so
      # build it explicitly — it must not rot in a corner.
      - uses: dtolnay/rust-toolchain@nightly

      # Run from INSIDE crates/injectee: rustup resolves the toolchain from
      # the current directory, and the workspace root pins stable — the
      # injectee's own nightly rust-toolchain.toml only applies from here.
      - name: Build injectee (separate nightly workspace)
        working-directory: crates/injectee
        run: cargo build --locked

  driver:
    name: Windows · driver build
    # Pinned to the VS2022 image: `windows-latest` moved to VS "18" (18.x),
    # and build.ps1's vswhere pin (`[17.0,18.0)`) — which matches the
    # dev-box-verified WDK 26100 toolset integration — finds no MSBuild
    # there. Revisit when the WDK integration is verified against 18.x.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # SDK + WDK, downloaded straight from Microsoft — the exact installers
      # winget's own manifests point at. Per Microsoft's kit versioning, the
      # SDK and WDK must match on BUILD number (26100) but not QFE, so the
      # live SDK 2454 link pairs with the live WDK 6584 link; the vcxproj
      # pins the generic 10.0.26100.0, which any 26100.x satisfies. winget
      # itself is a Store-licensed AppX the runner cannot launch. SHA-256
      # pins come from those same manifests.
      - name: Install Windows SDK + WDK
        shell: pwsh
        run: |
          $progressPreference = 'silentlyContinue'
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/a/f/2/af287d69-2c0a-4320-9d0f-555d5be767b9/WinSDKSetup.exe" -OutFile "$env:TEMP\WinSDKSetup.exe"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe" -OutFile "$env:TEMP\wdksetup.exe"
          $sdkHash = (Get-FileHash "$env:TEMP\WinSDKSetup.exe" -Algorithm SHA256).Hash
          if ($sdkHash -ne "2D1C2335BE6639464AC18A98FE55C96E5313608DE4EBFFB3CBA7ED5D113D994D") { throw "SDK installer hash mismatch: $sdkHash" }
          $wdkHash = (Get-FileHash "$env:TEMP\wdksetup.exe" -Algorithm SHA256).Hash
          if ($wdkHash -ne "ED82C46BD98E0F1D07FD6E5075900E42AEDC3FA5E68C06A8764B3DC5303CFF1B") { throw "WDK installer hash mismatch: $wdkHash" }
          $sdk = Start-Process -FilePath "$env:TEMP\WinSDKSetup.exe" -ArgumentList "/q", "/norestart" -Wait -PassThru
          if ($sdk.ExitCode -notin 0, 3010) { throw "SDK install failed: $($sdk.ExitCode)" }
          $wdk = Start-Process -FilePath "$env:TEMP\wdksetup.exe" -ArgumentList "/q", "/norestart" -Wait -PassThru
          if ($wdk.ExitCode -notin 0, 3010) { throw "WDK install failed: $($wdk.ExitCode)" }

      - name: Build driver + dumper + wiretest
        shell: pwsh
        run: ./driver/build.ps1 -Configuration Release

      # Wire contract: the committed fixture is byte-compared against the
      # schema by the C tool; the Rust mirror decodes the same bytes in the
      # protocol crate's golden test. Either side drifting fails one of the
      # two lanes.
      - name: Verify wire golden fixture (C side)
        shell: pwsh
        run: ./driver/wiretest/x64/Release/wiretest.exe --verify driver/tests/golden_v2.bin

      # Control-plane pinning: regenerate every committed fixture from the
      # REAL C structs/macros and require byte-identical output. A
      # secoutfallCommon.h change without fixture regeneration fails here
      # instead of silently diverging from the Rust mirrors.
      - name: Pin control-plane fixtures (C side)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wiretest = "./driver/wiretest/x64/Release/wiretest.exe"
          foreach ($name in @("injection", "drops", "filewatch", "protection", "security", "stats", "minimal-rename")) {
            & $wiretest --emit $name "driver/tests/emit_$name.bin"
          }
          & $wiretest --emit codes
          git diff --exit-code -- driver/tests/
          if ($LASTEXITCODE -ne 0) { throw "control-plane fixtures drifted from secoutfallCommon.h — regenerate with wiretest and update the Rust mirrors" }
