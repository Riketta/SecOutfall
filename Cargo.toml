[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/protocol",
    "crates/agent",
    "crates/user-actor",
    "crates/devtools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
agent = { path = "crates/agent" }
kernel = { path = "crates/kernel" }
protocol = { path = "crates/protocol" }
user-actor = { path = "crates/user-actor" }

anyhow = "1.0"
async-nats = "0.50"
async-trait = "0.1"
bytes = "1"
ferrisetw = "1.2"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "multipart",
    "stream",
    "native-tls",
] }
sha2 = "0.10"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false, features = ["sync"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
] }
windows-service = "0.7"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "warn"
