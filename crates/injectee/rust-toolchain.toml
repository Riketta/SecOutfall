# The injectee builds on nightly: `retour` static detours use nightly-only
# language features. This file stops rustup's upward lookup, so commands run
# inside crates/injectee never fall back to the workspace's stable pin.
# rustfmt is a BUILD dependency here: the windows-bindgen build script
# shells out to it to format the generated bindings.
[toolchain]
channel = "nightly"
profile = "minimal"
components = ["rustfmt"]
